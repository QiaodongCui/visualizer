<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Model Viewer</title>
<style>
  :root { --bg: #1e2228; --panel: #2a2f37; --text: #e6e6e6; --muted: #9aa3ad; --accent: #4c9aff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; overflow: hidden; }
  #toolbar { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid #000; z-index: 2; flex-wrap: wrap; }
  button, label.btn { background: #3a414c; color: var(--text); border: 1px solid #4a525e; border-radius: 4px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover, label.btn:hover { background: #46505d; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #nav { position: absolute; top: 60px; right: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 2; }
  #gizmo { width: 96px; height: 96px; cursor: pointer; touch-action: none; }
  #nav button { width: 30px; height: 30px; padding: 0; border-radius: 50%; border-color: transparent; background: rgba(42,47,55,.85); display: flex; align-items: center; justify-content: center; }
  #nav button:hover { background: #46505d; }
  #nav button.on { background: var(--accent); }
  #btnOrtho:not(.on) .ortho, #btnOrtho.on .persp { display: none; }
  #nav svg { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round; }
  #fileName { color: var(--muted); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  #viewport { position: absolute; inset: 0; }
  #info { position: absolute; left: 12px; bottom: 12px; background: rgba(42,47,55,.85); padding: 8px 12px; border-radius: 4px; font: 12px ui-monospace, monospace; color: var(--muted); white-space: pre; z-index: 2; }
  #help { position: absolute; right: 12px; bottom: 12px; background: rgba(42,47,55,.85); padding: 8px 12px; border-radius: 4px; font-size: 12px; color: var(--muted); z-index: 2; }
  #drop { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--muted); pointer-events: none; z-index: 1; }
  #drop.hover { background: rgba(76,154,255,.15); outline: 3px dashed var(--accent); outline-offset: -12px; color: var(--text); }
  #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: var(--panel); padding: 14px 20px; border-radius: 6px; display: none; z-index: 3; }
  input[type=file] { display: none; }
</style>
<script src="vendor/occt/occt-import-js.js"></script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/"
} }
</script>
</head>
<body>
<div id="toolbar">
  <label class="btn">Open file…<input id="fileInput" type="file" accept=".stl,.obj,.step,.stp,.msh"></label>
  <button id="btnFit">Fit view</button>
  <button id="btnWire">Wireframe</button>
  <button id="btnEdges" class="on">Edges</button>
  <button id="btnGrid" class="on">Grid</button>
  <button id="btnUp">Z up</button>
  <span id="fileName">No file loaded</span>
</div>
<div id="viewport"></div>
<div id="nav">
  <canvas id="gizmo"></canvas>
  <button id="btnOrtho" title="Perspective: click for orthographic (O)">
    <svg class="persp" viewBox="0 0 16 16" width="16" height="16"><path d="M5 3h6l4 10H1zM3 8h10M7 3 5.7 13M9 3l1.3 10"/></svg>
    <svg class="ortho" viewBox="0 0 16 16" width="16" height="16"><path d="M2 2h12v12H2zM2 6h12M2 10h12M6 2v12M10 2v12"/></svg>
  </button>
  <button id="btnIso" title="Isometric view (7)">
    <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 1.5 14 5v6l-6 3.5L2 11V5zM2 5l6 3.5L14 5M8 8.5v6"/></svg>
  </button>
</div>
<div id="drop">Drop a .step / .stp / .obj / .stl / .msh file here, or click “Open file…”</div>
<div id="status"></div>
<div id="info"></div>
<div id="help">Left-drag: rotate · Right-drag / Shift+drag: pan · Wheel: zoom · F: fit view · 1–7: views · O: ortho</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { parseMsh } from './msh.js';

const $ = id => document.getElementById(id);
const viewport = $('viewport');

// --- Scene setup ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
viewport.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e2228);

const aspect = () => window.innerWidth / window.innerHeight;
const perspCam = new THREE.PerspectiveCamera(45, aspect(), 0.01, 1e6);
const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 1e6);
let camera = perspCam;
camera.position.set(3, 2, 4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.screenSpacePanning = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const headLight = new THREE.DirectionalLight(0xffffff, 1.5);
camera.add(headLight);
headLight.position.set(1, 1, 2);
scene.add(perspCam, orthoCam);

let grid = new THREE.GridHelper(10, 20, 0x666666, 0x3a3f47);
scene.add(grid);
const axes = new THREE.AxesHelper(1);
scene.add(axes);

// Container that holds the loaded model; rotated for Z-up files.
const modelRoot = new THREE.Group();
scene.add(modelRoot);

let current = null;
let wireframe = false, showEdges = true, showGrid = true, zUp = false, ortho = false;
let fitDist = 0;  // camera distance from the last fitView()

const defaultMaterial = () => new THREE.MeshStandardMaterial({
  color: 0xb8c4d0, metalness: 0.1, roughness: 0.6, side: THREE.DoubleSide,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
});

// --- Loaders ---
async function loadSTL(buffer) {
  const geom = new STLLoader().parse(buffer);
  geom.computeVertexNormals();
  const mat = defaultMaterial();
  if (geom.hasColors) { mat.vertexColors = true; mat.color.set(0xffffff); }
  return new THREE.Mesh(geom, mat);
}

async function loadOBJ(buffer) {
  const text = new TextDecoder().decode(buffer);
  const obj = new OBJLoader().parse(text);
  obj.traverse(c => {
    if (c.isMesh) {
      if (!c.geometry.attributes.normal) c.geometry.computeVertexNormals();
      c.material = defaultMaterial();
    }
  });
  return obj;
}

let occtPromise = null;
function getOcct() {
  occtPromise ??= occtimportjs({
    locateFile: name => 'vendor/occt/' + name,
  });
  return occtPromise;
}

async function loadSTEP(buffer) {
  const occt = await getOcct();
  const result = occt.ReadStepFile(new Uint8Array(buffer), null);
  if (!result.success) throw new Error('Failed to parse STEP file');
  const group = new THREE.Group();
  for (const m of result.meshes) {
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
    if (m.attributes.normal) geom.setAttribute('normal', new THREE.Float32BufferAttribute(m.attributes.normal.array, 3));
    geom.setIndex(new THREE.Uint32BufferAttribute(Uint32Array.from(m.index.array), 1));
    if (!m.attributes.normal) geom.computeVertexNormals();
    const mat = defaultMaterial();
    if (m.color) mat.color.setRGB(m.color[0], m.color[1], m.color[2]);
    const mesh = new THREE.Mesh(geom, mat);
    mesh.name = m.name || '';
    group.add(mesh);
  }
  return group;
}

// Colors for the element groups of a .msh file with more than one group.
const GROUP_COLORS = [0xb8c4d0, 0xe0a370, 0x8fc488, 0xd88a9a, 0x9a9ce0, 0xd8cf7a, 0x7ccbcf, 0xc49ad6];

// Gmsh mesh: shows the outer surface of each element group with all element edges.
async function loadMSH(buffer) {
  const msh = parseMsh(buffer);
  const group = new THREE.Group();
  msh.groups.forEach((g, i) => {
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(g.positions, 3));
    geom.setIndex(new THREE.BufferAttribute(g.index, 1));
    const mat = defaultMaterial();
    mat.flatShading = true;  // facets show the element faces
    mat.color.set(GROUP_COLORS[i % GROUP_COLORS.length]);
    const mesh = new THREE.Mesh(geom, mat);
    mesh.name = g.name;
    const edges = new THREE.BufferGeometry();
    edges.setAttribute('position', geom.attributes.position);
    edges.setIndex(new THREE.BufferAttribute(g.edges, 1));
    mesh.userData.edgeGeometry = edges;
    group.add(mesh);
  });
  const tris = msh.groups.reduce((n, g) => n + g.index.length / 3, 0);
  group.userData.infoRows = [
    ['Format', msh.format],
    ['Nodes', msh.nodes],
    ...msh.elements,
    ...(msh.groups.length > 1 ? [['Groups', msh.groups.length]] : []),
    ['Surface tris', tris],
  ];
  return group;
}

const loaders = { stl: loadSTL, obj: loadOBJ, step: loadSTEP, stp: loadSTEP, msh: loadMSH };

// `getBuffer` is an async function returning the file's ArrayBuffer.
async function openFile(name, getBuffer) {
  const ext = name.split('.').pop().toLowerCase();
  const loader = loaders[ext];
  if (!loader) { alert('Unsupported file type: .' + ext); return; }
  showStatus(`Loading ${name}…`);
  try {
    const buffer = await getBuffer();
    const obj = await loader(buffer);
    setModel(obj);
    $('fileName').textContent = name;
    $('drop').style.display = 'none';
    setWindowTitle(`${name} - Model Viewer`);
  } catch (err) {
    console.error(err);
    alert('Could not load file: ' + err.message);
  } finally {
    showStatus(null);
  }
}

// In the desktop app, also set the native window title. The pywebview bridge is
// injected asynchronously, so wait for it if it isn't ready yet.
function setWindowTitle(title) {
  document.title = title;
  const apply = () => window.pywebview.api.set_title(title).catch(() => {});
  if (typeof window.pywebview?.api?.set_title === 'function') apply();
  else window.addEventListener('pywebviewready', apply, { once: true });
}

function showStatus(msg) {
  const s = $('status');
  s.textContent = msg || '';
  s.style.display = msg ? 'block' : 'none';
}

// --- Model handling ---
function disposeObject(obj) {
  obj.traverse(c => {
    c.geometry?.dispose();
    if (c.material) [].concat(c.material).forEach(m => m.dispose());
  });
}

function setModel(obj) {
  if (current) { modelRoot.remove(current); disposeObject(current); }
  current = obj;

  // Add edge overlay to each mesh: sharp edges, or the loader's own (all element edges).
  obj.traverse(c => {
    if (c.isMesh) {
      const edges = new THREE.LineSegments(
        c.userData.edgeGeometry ?? new THREE.EdgesGeometry(c.geometry, 30),
        new THREE.LineBasicMaterial({ color: 0x20252b }));
      edges.userData.isEdges = true;
      edges.visible = showEdges;
      c.add(edges);
    }
  });

  modelRoot.add(obj);
  applyWireframe();
  updateInfo();
  fitView(VIEWS.iso);
}

function updateInfo() {
  if (!current) { $('info').textContent = ''; return; }
  let tris = 0, meshes = 0;
  current.traverse(c => {
    if (c.isMesh) {
      meshes++;
      const g = c.geometry;
      tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
    }
  });
  const box = new THREE.Box3().setFromObject(current);
  const size = box.getSize(new THREE.Vector3());
  const f = v => v.toPrecision(5);
  const rows = [
    ...(current.userData.infoRows ?? [['Meshes', meshes], ['Triangles', tris]]),
    ['Size', `${f(size.x)} × ${f(size.y)} × ${f(size.z)}`],
    ['Min', `${f(box.min.x)}, ${f(box.min.y)}, ${f(box.min.z)}`],
    ['Max', `${f(box.max.x)}, ${f(box.max.y)}, ${f(box.max.z)}`],
  ];
  const width = Math.max(...rows.map(([label]) => label.length)) + 2;
  $('info').textContent = rows.map(([label, value]) =>
    (label + ':').padEnd(width) + value.toLocaleString()).join('\n');
}

// View directions (camera position relative to the model) in world space, which is
// always Y-up; with "Z up" on the model is rotated so these still match CAD views.
const VIEWS = {
  front: new THREE.Vector3(0, 0, 1),
  back: new THREE.Vector3(0, 0, -1),
  left: new THREE.Vector3(-1, 0, 0),
  right: new THREE.Vector3(1, 0, 0),
  // Looking straight down/up is degenerate for lookAt; tilt a hair toward the front
  // so the front of the model is at the bottom of the screen in the top view.
  top: new THREE.Vector3(0, 1, 1e-4),
  bottom: new THREE.Vector3(0, -1, 1e-4),
  iso: new THREE.Vector3(1, 1, 1),
};

const tanHalfFov = () => Math.tan(THREE.MathUtils.degToRad(perspCam.fov / 2));

// Orthographic frustum showing `halfHeight` world units above and below the view center.
function setOrthoFrustum(halfHeight, zoom = 1) {
  Object.assign(orthoCam, {
    top: halfHeight, bottom: -halfHeight,
    left: -halfHeight * aspect(), right: halfHeight * aspect(), zoom,
  });
  orthoCam.updateProjectionMatrix();
}

// Fits the model, looking from `dir` (defaults to the current view direction).
function fitView(dir = camera.position.clone().sub(controls.target)) {
  if (!current) return;
  modelRoot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(modelRoot);
  if (box.isEmpty()) return;
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 1e-6);

  // Drop leftover orbit momentum so the camera lands exactly on `dir`.
  controls.enableDamping = false;
  controls.update();
  controls.enableDamping = true;

  const dist = radius / Math.sin(THREE.MathUtils.degToRad(perspCam.fov / 2));
  fitDist = dist;
  for (const cam of [perspCam, orthoCam]) {
    cam.position.copy(center).addScaledVector(dir.clone().normalize(), dist);
    cam.near = dist / 1000;
    cam.far = dist * 100;
  }
  perspCam.updateProjectionMatrix();
  setOrthoFrustum(dist * tanHalfFov());  // same size at the target as the perspective view
  controls.target.copy(center);
  controls.update();

  // Resize grid / axes to model scale, placed under the model.
  scene.remove(grid);
  const span = Math.pow(10, Math.ceil(Math.log10(Math.max(size.x, size.z, size.y) * 2)));
  grid = new THREE.GridHelper(span, 20, 0x666666, 0x3a3f47);
  grid.position.set(center.x, box.min.y, center.z);
  grid.visible = showGrid;
  scene.add(grid);
  axes.scale.setScalar(radius * 0.5);
  axes.visible = showGrid;
}

// Switches between perspective and orthographic, keeping the view direction and the
// visible size at the orbit target so the model doesn't jump.
function setOrtho(on) {
  ortho = toggle($('btnOrtho'), on);
  $('btnOrtho').title = on ? 'Orthographic: click for perspective (O)' : 'Perspective: click for orthographic (O)';
  const from = camera, to = on ? orthoCam : perspCam;
  if (from === to) return;
  const offset = from.position.clone().sub(controls.target);
  if (on) {
    setOrthoFrustum(offset.length() * tanHalfFov());
    // Ortho zoom doesn't move the camera; keep it back far enough not to clip the model.
    offset.setLength(Math.max(offset.length(), fitDist));
  } else {
    offset.setLength(orthoCam.top / orthoCam.zoom / tanHalfFov());
  }
  to.position.copy(controls.target).add(offset);
  to.quaternion.copy(from.quaternion);
  to.add(headLight);
  camera = controls.object = to;
  controls.update();
}

function applyWireframe() {
  current?.traverse(c => {
    if (c.isMesh) [].concat(c.material).forEach(m => m.wireframe = wireframe);
    if (c.userData.isEdges) c.visible = showEdges && !wireframe;
  });
}

// --- UI ---
function toggle(btn, value) { btn.classList.toggle('on', value); return value; }

$('fileInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) openFile(f.name, () => f.arrayBuffer());
  e.target.value = '';
});
$('btnFit').onclick = () => fitView();
$('btnWire').onclick = e => { wireframe = toggle(e.target, !wireframe); applyWireframe(); };
$('btnEdges').onclick = e => { showEdges = toggle(e.target, !showEdges); applyWireframe(); };
$('btnGrid').onclick = e => { showGrid = toggle(e.target, !showGrid); grid.visible = axes.visible = showGrid; };
$('btnUp').onclick = e => {
  zUp = toggle(e.target, !zUp);
  // The axes show the model's axes, matching the gizmo.
  axes.rotation.x = modelRoot.rotation.x = zUp ? -Math.PI / 2 : 0;
  fitView();
};

$('btnOrtho').onclick = () => setOrtho(!ortho);
$('btnIso').onclick = () => fitView(VIEWS.iso);

// View keys follow the SolidWorks order (Ctrl+1..7 there).
const viewKeys = { 1: 'front', 2: 'back', 3: 'left', 4: 'right', 5: 'top', 6: 'bottom', 7: 'iso' };
window.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (key === 'f') fitView();
  else if (key === 'o') setOrtho(!ortho);
  else if (viewKeys[key]) { e.preventDefault(); fitView(VIEWS[viewKeys[key]]); }
});

// --- Navigation gizmo (Blender-style) ---
// Shows the model's axes. Click an axis ball to look from that side, click it again
// for the opposite side, drag to orbit.
const gizmo = $('gizmo'), gctx = gizmo.getContext('2d');
const GIZMO_SIZE = 96, BALL_R = 9, ARM = 34;  // CSS px
const gizmoAxes = [['X', '#e8445a'], ['Y', '#7cc83a'], ['Z', '#3d8ff0']].flatMap(([axis, color], i) => {
  const dir = new THREE.Vector3().setComponent(i, 1);
  return [
    { label: axis, dir, color, positive: true },
    { label: '-' + axis, dir: dir.clone().negate(), color, positive: false },
  ];
});
let gizmoPointer = null, gizmoDrag = null;

// Axis balls in gizmo pixels, sorted back to front; `world` is the axis direction in world space.
function gizmoBalls() {
  const toView = camera.quaternion.clone().invert();
  return gizmoAxes.map(a => {
    const world = a.dir.clone().applyQuaternion(modelRoot.quaternion);
    const v = world.clone().applyQuaternion(toView);
    return { ...a, world, x: GIZMO_SIZE / 2 + v.x * ARM, y: GIZMO_SIZE / 2 - v.y * ARM, depth: v.z };
  }).sort((a, b) => a.depth - b.depth);
}

const ballAt = (balls, p) => balls.findLast(b => Math.hypot(b.x - p.x, b.y - p.y) <= BALL_R + 1);

// Name of the view in VIEWS that looks from world direction `dir`.
const viewFrom = dir => Object.keys(VIEWS).find(n => n !== 'iso' && VIEWS[n].clone().normalize().dot(dir) > 0.99);

function drawGizmo() {
  const dpr = window.devicePixelRatio, px = Math.round(GIZMO_SIZE * dpr), c = GIZMO_SIZE / 2;
  if (gizmo.width !== px) gizmo.width = gizmo.height = px;
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, GIZMO_SIZE, GIZMO_SIZE);
  if (gizmoPointer || gizmoDrag) {
    gctx.fillStyle = 'rgba(255,255,255,.08)';
    gctx.beginPath(); gctx.arc(c, c, c, 0, 2 * Math.PI); gctx.fill();
  }

  const balls = gizmoBalls();
  const hover = gizmoPointer && !gizmoDrag?.moved ? ballAt(balls, gizmoPointer) : null;
  gctx.font = 'bold 11px system-ui, sans-serif';
  gctx.textAlign = 'center';
  gctx.textBaseline = 'middle';
  for (const b of balls) {
    gctx.strokeStyle = gctx.fillStyle = b.color;
    if (b.positive) {
      gctx.lineWidth = 2;
      gctx.beginPath(); gctx.moveTo(c, c); gctx.lineTo(b.x, b.y); gctx.stroke();
    }
    gctx.beginPath(); gctx.arc(b.x, b.y, BALL_R, 0, 2 * Math.PI);
    if (!b.positive) {
      // Opaque dark base so a negative ball hides the balls behind it.
      gctx.fillStyle = '#2a2f37';
      gctx.fill();
      gctx.fillStyle = b.color;
      gctx.globalAlpha = 0.35;
    }
    gctx.fill();
    gctx.globalAlpha = 1;
    gctx.lineWidth = 1.5;
    if (b === hover) gctx.strokeStyle = '#fff';
    if (b === hover || !b.positive) gctx.stroke();
    if (b.positive || b === hover) {
      gctx.fillStyle = b.positive ? '#1e2228' : '#fff';
      gctx.fillText(b.label, b.x, b.y + 0.5);
    }
  }

  const name = hover && viewFrom(hover.world);
  const tip = name ? name[0].toUpperCase() + name.slice(1) + ' view' : '';
  if (gizmo.title !== tip) gizmo.title = tip;
}

gizmo.addEventListener('pointerdown', e => {
  gizmoDrag = { x: e.clientX, y: e.clientY, moved: false };
  gizmo.setPointerCapture(e.pointerId);
});
gizmo.addEventListener('pointermove', e => {
  const r = gizmo.getBoundingClientRect();
  gizmoPointer = { x: e.clientX - r.left, y: e.clientY - r.top };
  if (!gizmoDrag) return;
  const dx = e.clientX - gizmoDrag.x, dy = e.clientY - gizmoDrag.y;
  if (!gizmoDrag.moved && Math.hypot(dx, dy) < 3) return;
  gizmoDrag = { x: e.clientX, y: e.clientY, moved: true };
  // Orbit with the same direction and speed as dragging in the viewport.
  const k = 2 * Math.PI / renderer.domElement.clientHeight;
  const offset = camera.position.clone().sub(controls.target);
  const s = new THREE.Spherical().setFromVector3(offset);
  s.theta -= dx * k;
  s.phi = THREE.MathUtils.clamp(s.phi - dy * k, 1e-4, Math.PI - 1e-4);
  camera.position.copy(controls.target).add(offset.setFromSpherical(s));
  controls.update();
});
gizmo.addEventListener('pointerup', () => {
  const ball = gizmoDrag && !gizmoDrag.moved && gizmoPointer && ballAt(gizmoBalls(), gizmoPointer);
  gizmoDrag = null;
  if (!ball) return;
  // Like Blender: clicking the axis you're already looking along flips to the opposite side.
  const current = camera.position.clone().sub(controls.target).normalize();
  fitView(VIEWS[viewFrom(current.dot(ball.world) > 0.999 ? ball.world.clone().negate() : ball.world)]);
});
gizmo.addEventListener('pointerleave', () => { gizmoPointer = null; });

// Drag and drop.
const drop = $('drop');
window.addEventListener('dragover', e => { e.preventDefault(); drop.style.display = 'flex'; drop.classList.add('hover'); });
window.addEventListener('dragleave', e => {
  if (e.relatedTarget === null) { drop.classList.remove('hover'); if (current) drop.style.display = 'none'; }
});
window.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('hover');
  if (current) drop.style.display = 'none';
  const f = e.dataTransfer.files[0];
  if (f) openFile(f.name, () => f.arrayBuffer());
});

// File passed on the command line by the desktop app (e.g. double-clicked in Explorer).
const params = new URLSearchParams(location.search);
if (params.has('open')) {
  openFile(params.get('name'), async () => {
    const res = await fetch('/file/' + encodeURIComponent(params.get('open')));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.arrayBuffer();
  });
}

window.addEventListener('resize', () => {
  perspCam.aspect = aspect();
  perspCam.updateProjectionMatrix();
  setOrthoFrustum(orthoCam.top, orthoCam.zoom);
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  drawGizmo();
});
</script>
</body>
</html>
