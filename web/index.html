<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Model Viewer</title>
<style>
  :root { --bg: #1e2228; --panel: #2a2f37; --text: #e6e6e6; --muted: #9aa3ad; --accent: #4c9aff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; overflow: hidden; }
  #toolbar { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid #000; z-index: 2; flex-wrap: wrap; }
  button, label.btn { background: #3a414c; color: var(--text); border: 1px solid #4a525e; border-radius: 4px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover, label.btn:hover { background: #46505d; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #fileName { color: var(--muted); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  #viewport { position: absolute; inset: 0; }
  #info { position: absolute; left: 12px; bottom: 12px; background: rgba(42,47,55,.85); padding: 8px 12px; border-radius: 4px; font: 12px ui-monospace, monospace; color: var(--muted); white-space: pre; z-index: 2; }
  #help { position: absolute; right: 12px; bottom: 12px; background: rgba(42,47,55,.85); padding: 8px 12px; border-radius: 4px; font-size: 12px; color: var(--muted); z-index: 2; }
  #drop { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--muted); pointer-events: none; z-index: 1; }
  #drop.hover { background: rgba(76,154,255,.15); outline: 3px dashed var(--accent); outline-offset: -12px; color: var(--text); }
  #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: var(--panel); padding: 14px 20px; border-radius: 6px; display: none; z-index: 3; }
  input[type=file] { display: none; }
</style>
<script src="vendor/occt/occt-import-js.js"></script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/"
} }
</script>
</head>
<body>
<div id="toolbar">
  <label class="btn">Open file…<input id="fileInput" type="file" accept=".stl,.obj,.step,.stp"></label>
  <button id="btnFit">Fit view</button>
  <button id="btnWire">Wireframe</button>
  <button id="btnEdges" class="on">Edges</button>
  <button id="btnGrid" class="on">Grid</button>
  <button id="btnUp">Z up</button>
  <span id="fileName">No file loaded</span>
</div>
<div id="viewport"></div>
<div id="drop">Drop a .step / .stp / .obj / .stl file here, or click “Open file…”</div>
<div id="status"></div>
<div id="info"></div>
<div id="help">Left-drag: rotate · Right-drag / Shift+drag: pan · Wheel: zoom · F: fit view</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const $ = id => document.getElementById(id);
const viewport = $('viewport');

// --- Scene setup ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
viewport.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e2228);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1e6);
camera.position.set(3, 2, 4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.screenSpacePanning = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const headLight = new THREE.DirectionalLight(0xffffff, 1.5);
camera.add(headLight);
headLight.position.set(1, 1, 2);
scene.add(camera);

let grid = new THREE.GridHelper(10, 20, 0x666666, 0x3a3f47);
scene.add(grid);
const axes = new THREE.AxesHelper(1);
scene.add(axes);

// Container that holds the loaded model; rotated for Z-up files.
const modelRoot = new THREE.Group();
scene.add(modelRoot);

let current = null;
let wireframe = false, showEdges = true, showGrid = true, zUp = false;

const defaultMaterial = () => new THREE.MeshStandardMaterial({
  color: 0xb8c4d0, metalness: 0.1, roughness: 0.6, side: THREE.DoubleSide,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
});

// --- Loaders ---
async function loadSTL(buffer) {
  const geom = new STLLoader().parse(buffer);
  geom.computeVertexNormals();
  const mat = defaultMaterial();
  if (geom.hasColors) { mat.vertexColors = true; mat.color.set(0xffffff); }
  return new THREE.Mesh(geom, mat);
}

async function loadOBJ(buffer) {
  const text = new TextDecoder().decode(buffer);
  const obj = new OBJLoader().parse(text);
  obj.traverse(c => {
    if (c.isMesh) {
      if (!c.geometry.attributes.normal) c.geometry.computeVertexNormals();
      c.material = defaultMaterial();
    }
  });
  return obj;
}

let occtPromise = null;
function getOcct() {
  occtPromise ??= occtimportjs({
    locateFile: name => 'vendor/occt/' + name,
  });
  return occtPromise;
}

async function loadSTEP(buffer) {
  const occt = await getOcct();
  const result = occt.ReadStepFile(new Uint8Array(buffer), null);
  if (!result.success) throw new Error('Failed to parse STEP file');
  const group = new THREE.Group();
  for (const m of result.meshes) {
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
    if (m.attributes.normal) geom.setAttribute('normal', new THREE.Float32BufferAttribute(m.attributes.normal.array, 3));
    geom.setIndex(new THREE.Uint32BufferAttribute(Uint32Array.from(m.index.array), 1));
    if (!m.attributes.normal) geom.computeVertexNormals();
    const mat = defaultMaterial();
    if (m.color) mat.color.setRGB(m.color[0], m.color[1], m.color[2]);
    const mesh = new THREE.Mesh(geom, mat);
    mesh.name = m.name || '';
    group.add(mesh);
  }
  return group;
}

const loaders = { stl: loadSTL, obj: loadOBJ, step: loadSTEP, stp: loadSTEP };

// `getBuffer` is an async function returning the file's ArrayBuffer.
async function openFile(name, getBuffer) {
  const ext = name.split('.').pop().toLowerCase();
  const loader = loaders[ext];
  if (!loader) { alert('Unsupported file type: .' + ext); return; }
  showStatus(`Loading ${name}…`);
  try {
    const buffer = await getBuffer();
    const obj = await loader(buffer);
    setModel(obj);
    $('fileName').textContent = name;
    $('drop').style.display = 'none';
    setWindowTitle(`${name} - Model Viewer`);
  } catch (err) {
    console.error(err);
    alert('Could not load file: ' + err.message);
  } finally {
    showStatus(null);
  }
}

// In the desktop app, also set the native window title. The pywebview bridge is
// injected asynchronously, so wait for it if it isn't ready yet.
function setWindowTitle(title) {
  document.title = title;
  const apply = () => window.pywebview.api.set_title(title).catch(() => {});
  if (typeof window.pywebview?.api?.set_title === 'function') apply();
  else window.addEventListener('pywebviewready', apply, { once: true });
}

function showStatus(msg) {
  const s = $('status');
  s.textContent = msg || '';
  s.style.display = msg ? 'block' : 'none';
}

// --- Model handling ---
function disposeObject(obj) {
  obj.traverse(c => {
    c.geometry?.dispose();
    if (c.material) [].concat(c.material).forEach(m => m.dispose());
  });
}

function setModel(obj) {
  if (current) { modelRoot.remove(current); disposeObject(current); }
  current = obj;

  // Add edge overlay to each mesh.
  obj.traverse(c => {
    if (c.isMesh) {
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(c.geometry, 30),
        new THREE.LineBasicMaterial({ color: 0x20252b }));
      edges.userData.isEdges = true;
      edges.visible = showEdges;
      c.add(edges);
    }
  });

  modelRoot.add(obj);
  applyWireframe();
  updateInfo();
  fitView();
}

function updateInfo() {
  if (!current) { $('info').textContent = ''; return; }
  let tris = 0, meshes = 0;
  current.traverse(c => {
    if (c.isMesh) {
      meshes++;
      const g = c.geometry;
      tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
    }
  });
  const box = new THREE.Box3().setFromObject(current);
  const size = box.getSize(new THREE.Vector3());
  const f = v => v.toPrecision(5);
  $('info').textContent =
    `Meshes:    ${meshes}\nTriangles: ${tris.toLocaleString()}\n` +
    `Size:      ${f(size.x)} × ${f(size.y)} × ${f(size.z)}\n` +
    `Min:       ${f(box.min.x)}, ${f(box.min.y)}, ${f(box.min.z)}\n` +
    `Max:       ${f(box.max.x)}, ${f(box.max.y)}, ${f(box.max.z)}`;
}

function fitView() {
  if (!current) return;
  modelRoot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(modelRoot);
  if (box.isEmpty()) return;
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 1e-6);

  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2));
  const dir = new THREE.Vector3(1, 0.8, 1.2).normalize();
  camera.position.copy(center).addScaledVector(dir, dist);
  camera.near = dist / 1000;
  camera.far = dist * 100;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();

  // Resize grid / axes to model scale, placed under the model.
  scene.remove(grid);
  const span = Math.pow(10, Math.ceil(Math.log10(Math.max(size.x, size.z, size.y) * 2)));
  grid = new THREE.GridHelper(span, 20, 0x666666, 0x3a3f47);
  grid.position.set(center.x, box.min.y, center.z);
  grid.visible = showGrid;
  scene.add(grid);
  axes.scale.setScalar(radius * 0.5);
  axes.visible = showGrid;
}

function applyWireframe() {
  current?.traverse(c => {
    if (c.isMesh) [].concat(c.material).forEach(m => m.wireframe = wireframe);
    if (c.userData.isEdges) c.visible = showEdges && !wireframe;
  });
}

// --- UI ---
function toggle(btn, value) { btn.classList.toggle('on', value); return value; }

$('fileInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) openFile(f.name, () => f.arrayBuffer());
  e.target.value = '';
});
$('btnFit').onclick = fitView;
$('btnWire').onclick = e => { wireframe = toggle(e.target, !wireframe); applyWireframe(); };
$('btnEdges').onclick = e => { showEdges = toggle(e.target, !showEdges); applyWireframe(); };
$('btnGrid').onclick = e => { showGrid = toggle(e.target, !showGrid); grid.visible = axes.visible = showGrid; };
$('btnUp').onclick = e => {
  zUp = toggle(e.target, !zUp);
  modelRoot.rotation.x = zUp ? -Math.PI / 2 : 0;
  fitView();
};

window.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') fitView(); });

// Drag and drop.
const drop = $('drop');
window.addEventListener('dragover', e => { e.preventDefault(); drop.style.display = 'flex'; drop.classList.add('hover'); });
window.addEventListener('dragleave', e => {
  if (e.relatedTarget === null) { drop.classList.remove('hover'); if (current) drop.style.display = 'none'; }
});
window.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('hover');
  if (current) drop.style.display = 'none';
  const f = e.dataTransfer.files[0];
  if (f) openFile(f.name, () => f.arrayBuffer());
});

// File passed on the command line by the desktop app (e.g. double-clicked in Explorer).
const params = new URLSearchParams(location.search);
if (params.has('open')) {
  openFile(params.get('name'), async () => {
    const res = await fetch('/file/' + encodeURIComponent(params.get('open')));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.arrayBuffer();
  });
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
